<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#0f1117"/>
  <!-- Subtle grid -->
  <line x1="0" y1="30" x2="120" y2="30" stroke="#1f2430" stroke-width="1"/>
  <line x1="0" y1="60" x2="120" y2="60" stroke="#1f2430" stroke-width="1"/>
  <line x1="0" y1="90" x2="120" y2="90" stroke="#1f2430" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="120" stroke="#1f2430" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="120" stroke="#1f2430" stroke-width="1"/>
  <line x1="90" y1="0" x2="90" y2="120" stroke="#1f2430" stroke-width="1"/>
  
  <!-- Candlesticks -->
  <!-- Candle 1: Green -->
  <line x1="20" y1="65" x2="20" y2="95" stroke="#10b981" stroke-width="1.5"/>
  <rect x="16" y="70" width="8" height="18" fill="#10b981" rx="1"/>
  
  <!-- Candle 2: Red -->
  <line x1="38" y1="55" x2="38" y2="85" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="34" y="60" width="8" height="14" fill="#ef4444" rx="1"/>

  <!-- Candle 3: Green -->
  <line x1="56" y1="40" x2="56" y2="75" stroke="#10b981" stroke-width="1.5"/>
  <rect x="52" y="46" width="8" height="22" fill="#10b981" rx="1"/>

  <!-- Candle 4: Red -->
  <line x1="74" y1="35" x2="74" y2="65" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="70" y="42" width="8" height="12" fill="#ef4444" rx="1"/>

  <!-- Candle 5: Green big breakout -->
  <line x1="92" y1="18" x2="92" y2="52" stroke="#10b981" stroke-width="1.5"/>
  <rect x="88" y="22" width="8" height="24" fill="#10b981" rx="1"/>

  <!-- Trendline with glow -->
  <path d="M 10 90 Q 35 75, 55 55 T 105 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="105" cy="20" r="3.5" fill="#38bdf8"/>
</svg>