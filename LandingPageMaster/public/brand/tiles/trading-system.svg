<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#f5f0e8"/>
  <!-- Subtle warm grid -->
  <line x1="0" y1="30" x2="120" y2="30" stroke="#e6ddd0" stroke-width="1"/>
  <line x1="0" y1="60" x2="120" y2="60" stroke="#e6ddd0" stroke-width="1"/>
  <line x1="0" y1="90" x2="120" y2="90" stroke="#e6ddd0" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="120" stroke="#e6ddd0" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="120" stroke="#e6ddd0" stroke-width="1"/>
  <line x1="90" y1="0" x2="90" y2="120" stroke="#e6ddd0" stroke-width="1"/>

  <!-- Candlesticks -->
  <line x1="20" y1="65" x2="20" y2="95" stroke="#15803d" stroke-width="1.6"/>
  <rect x="16" y="70" width="8" height="18" fill="#16a34a" rx="1.5"/>

  <line x1="38" y1="55" x2="38" y2="85" stroke="#c2410c" stroke-width="1.6"/>
  <rect x="34" y="60" width="8" height="14" fill="#ea580c" rx="1.5"/>

  <line x1="56" y1="40" x2="56" y2="75" stroke="#15803d" stroke-width="1.6"/>
  <rect x="52" y="46" width="8" height="22" fill="#16a34a" rx="1.5"/>

  <line x1="74" y1="35" x2="74" y2="65" stroke="#c2410c" stroke-width="1.6"/>
  <rect x="70" y="42" width="8" height="12" fill="#ea580c" rx="1.5"/>

  <line x1="92" y1="18" x2="92" y2="52" stroke="#15803d" stroke-width="1.6"/>
  <rect x="88" y="22" width="8" height="24" fill="#16a34a" rx="1.5"/>

  <!-- Brand terracotta trendline -->
  <path d="M 10 90 Q 35 75, 55 55 T 105 20" fill="none" stroke="#c2410c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="105" cy="20" r="3.5" fill="#c2410c"/>
</svg>
